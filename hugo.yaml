baseURL: "https://acje.github.io/"
locale: "en-US"
title: "Anders Jensen"

# Use a standard content directory to avoid scanning theme/public
contentDir: "content"

# Caps .Summary at 20 words, which bounds the theme's plain
# <meta name="description"> for pages without an explicit description
summaryLength: 20

# Canonify URLs for GitHub Pages and avoid relative link pitfalls
relativeURLs: false

# Allow raw HTML in Markdown
markup:
  goldmark:
    renderer:
      unsafe: true

# Enable sitemap and robots.txt for SEO
enableRobotsTXT: true

# Disable generators you may not use yet
disableKinds:
  - taxonomy
  - term
 
module:
  imports:
    - path: hugo-book
      mounts:
        - source: archetypes
          target: archetypes
        - source: assets
          target: assets
        - source: i18n
          target: i18n
        - source: layouts
          target: layouts
        - source: static
          target: static
          files:
            - favicon.png
            - favicon.svg
            - apple-touch-icon.png
            - minisearch.min.js

frontmatter:
  date:
    - date
  publishDate:
    - publishdate
    - pubdate
    - published
    - date
  lastmod:
    - lastmod
    - modified

# Site parameters
params:
  # Book-specific theme parameters
  BookTheme: "auto"
  BookRepo: "https://github.com/acje/acje.github.io"
  BookEditPath: "edit/main/content"
  BookDateFormat: "January 2, 2006"
  BookToC: true
  BookComments: false
  BookSearch: true
  BookSection: "*"
  
  # Author and site metadata
  author: "Anders Jensen"
  description: "Strategic insights on agency, systems architecture, and information security"
  email: "anders.c.jensen@gmail.com"
  
  # SEO: Default Open Graph image (raster 1200x630 card, see assets/og/)
  images:
    - /og-card.png
  
# Social and external links
menu:
  after:
    - name: "Email"
      url: "mailto:anders.c.jensen@gmail.com"
      weight: 5
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/anders-jensen-481a3374/"
      weight: 10
    - name: "Substack"
      url: "https://anderscj.substack.com/"
      weight: 20
    - name: "GitHub"
      url: "https://github.com/acje/"
      weight: 30

caches:
  images:
    dir: :cacheDir/images